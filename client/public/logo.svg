<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <linearGradient id="aeviqPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="aeviqBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="lineGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="lineGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#00C6FF" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- AEVIQ Logo Mark -->
    <g transform="translate(150, 0)">
      <path d="M 16 85 L 56 12 L 78 12 L 38 85 Z" fill="url(#aeviqPurple)" />
      <path d="M 52 48 L 98 85 L 74 85 L 38 54 Z" fill="url(#aeviqBlue)" />
      <polygon points="42,85 54,64 64,85" fill="#FFFFFF" />

      <!-- Floating Pixel Squares -->
      <rect x="80" y="4" width="9" height="9" fill="#00C6FF" rx="1.5" />
      <rect x="66" y="16" width="8" height="8" fill="#9333EA" rx="1.5" />
      <rect x="86" y="20" width="7" height="7" fill="#00C6FF" rx="1.5" />
      <rect x="62" y="32" width="13" height="13" fill="#2563EB" rx="2" />
    </g>

    <!-- "AEVIQ" Text -->
    <text x="75" y="122" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="800" font-size="44" fill="#0D1127" letter-spacing="14">AEVIQ</text>

    <!-- "SOLUTIONS" Row with flanked lines -->
    <g transform="translate(20, 142)">
      <line x1="10" y1="5" x2="100" y2="5" stroke="url(#lineGradLeft)" stroke-width="2.5" stroke-linecap="round" />
      <text x="120" y="10" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="700" font-size="14" fill="#6366F1" letter-spacing="10">SOLUTIONS</text>
      <line x1="330" y1="5" x2="420" y2="5" stroke="url(#lineGradRight)" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
